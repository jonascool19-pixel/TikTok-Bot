name: Windows installer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Windows version tag, e.g. windows-v0.1.0'
        required: true
        type: string
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Build and verify setup
        shell: pwsh
        env:
          VERSION_TAG: ${{ inputs.tag }}
        run: |
          if ($env:VERSION_TAG -cnotmatch '^windows-v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Expected a Windows version tag.'
          }
          $version = $env:VERSION_TAG.Substring(9)
          $sdkVersion = '1.0.3595.46'
          $zipPath = Join-Path $env:RUNNER_TEMP 'webview2.zip'
          $sdk = Join-Path $env:RUNNER_TEMP 'webview2'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$sdkVersion/microsoft.web.webview2.$sdkVersion.nupkg" -OutFile $zipPath
          Expand-Archive -LiteralPath $zipPath -DestinationPath $sdk
          $app = (New-Item -ItemType Directory -Path windows/build/app -Force).FullName
          $core = Join-Path $sdk 'lib/net462/Microsoft.Web.WebView2.Core.dll'
          $forms = Join-Path $sdk 'lib/net462/Microsoft.Web.WebView2.WinForms.dll'
          Copy-Item -LiteralPath @($core, $forms, (Join-Path $sdk 'runtimes/win-x64/native/WebView2Loader.dll')) -Destination $app
          Copy-Item -LiteralPath windows/SpotifyControl.ps1 -Destination $app
          $ai = Join-Path $app 'ai'
          $aiZip = Join-Path $env:RUNNER_TEMP 'llama.zip'
          curl.exe --fail --silent --show-error --location --retry 3 -o $aiZip 'https://github.com/ggml-org/llama.cpp/releases/download/b5046/llama-b5046-bin-win-avx2-x64.zip'
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $aiZip).Hash -ne '5D534B910F803FD5D4E137EDCD58EBEB225A6B6D046AB6B3813D2C0D0EE8DCAF') { throw 'AI runtime checksum mismatch.' }
          Expand-Archive -LiteralPath $aiZip -DestinationPath $ai
          $modelBase = 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67'
          curl.exe --fail --silent --show-error --location --retry 3 -o "$ai/model.gguf" "$modelBase/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash "$ai/model.gguf").Hash -ne '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db') { throw 'AI model checksum mismatch.' }
          Invoke-WebRequest "$modelBase/LICENSE" -OutFile "$ai/Qwen-LICENSE.txt"
          Invoke-WebRequest 'https://raw.githubusercontent.com/ggml-org/llama.cpp/b5046/LICENSE' -OutFile "$ai/llama-LICENSE.txt"
          $piperZip = Join-Path $env:RUNNER_TEMP 'piper.zip'
          Invoke-WebRequest 'https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip' -OutFile $piperZip
          if ((Get-FileHash $piperZip).Hash -ne 'F3C58906402B24F3A96D92145F58ACBA6D86C9B5DB896D207F78DC80811EFCEA') { throw 'Piper checksum mismatch.' }
          Expand-Archive -LiteralPath $piperZip -DestinationPath $app
          $piper = Join-Path $app 'piper'
          Invoke-WebRequest 'https://raw.githubusercontent.com/rhasspy/piper/2023.11.14-2/LICENSE.md' -OutFile "$piper/Piper-LICENSE.md"
          $sourceVoices = 'https://huggingface.co/rhasspy/piper-voices/resolve/6b9cfaacb4fb2e02a9621227e3c1a48bec9710c3/de/de_DE'
          foreach ($voice in @(@('kerstin','low'), @('thorsten_emotional','medium'))) {
            $name = "de_DE-$($voice[0])-$($voice[1])"
            $url = "$sourceVoices/$($voice[0])/$($voice[1])"
            foreach ($suffix in '.onnx','.onnx.json') {
              Invoke-WebRequest "$url/$name$suffix" -OutFile "$piper/$name$suffix"
            }
            Invoke-WebRequest "$url/MODEL_CARD" -OutFile "$piper/$name-MODEL_CARD.md"
          }
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $sources = @(Get-ChildItem -LiteralPath windows -Filter '*.cs' -File | Select-Object -ExpandProperty FullName)
          $versionSource = Join-Path $env:RUNNER_TEMP 'TikTokBot-Version.cs'
          '[assembly: System.Reflection.AssemblyVersion("{0}.0")]' -f $version | Set-Content -LiteralPath $versionSource
          $sources += $versionSource
          $icon = (Resolve-Path windows/TikTok-Bot.ico).Path
          $wpf = Join-Path (Split-Path $csc) 'WPF'
          & $csc /nologo /warnaserror /codepage:65001 /target:winexe /platform:x64 "/win32icon:$icon" "/out:$app\TikTok-Bot.exe" "/reference:$core" "/reference:$forms" "/reference:$wpf\System.Speech.dll" "/reference:$wpf\PresentationCore.dll" "/reference:$wpf\WindowsBase.dll" /reference:System.Net.Http.dll /reference:System.Web.Extensions.dll /reference:System.Security.dll $sources
          if ($LASTEXITCODE -ne 0) { throw 'Application compilation failed.' }
          $inno = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6/ISCC.exe'
          & $inno "/DAppVersion=$version" windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }

          function Invoke-CheckedProcess($file, $arguments) {
            $process = Start-Process -FilePath $file -ArgumentList $arguments -WindowStyle Hidden -PassThru
            if (!$process.WaitForExit(180000)) {
              $process.Kill()
              throw "Timed out: $file"
            }
            if ($process.ExitCode -ne 0) { throw "$file exited with code $($process.ExitCode)" }
          }
          $installer = (Resolve-Path windows/build/TikTok-Bot-Setup.exe).Path
          $installed = Join-Path $env:RUNNER_TEMP 'TikTok-Bot-install-test'
          $shortcut = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'TikTok-Bot.lnk'
          Invoke-CheckedProcess $installer ('/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="{0}"' -f $installed)
          if (Test-Path -LiteralPath $shortcut) { throw 'Desktop shortcut should be optional.' }
          $profile = Join-Path $env:LOCALAPPDATA 'TikTok-Bot/WindowsPrototype/BotProfile'
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $marker = Join-Path $profile 'installer-profile-test.txt'
          Set-Content -LiteralPath $marker -Value 'existing local data'
          Invoke-CheckedProcess $installer ('/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /UPDATEBOT=1 /TASKS=desktopicon /DIR="{0}"' -f $installed)
          if ((Get-Content -LiteralPath $marker) -ne 'existing local data') { throw 'Setup modified the local profile.' }
          $exe = Join-Path $installed 'TikTok-Bot.exe'
          $restarted = Get-Process -Name 'TikTok-Bot' -ErrorAction SilentlyContinue | Where-Object Path -EQ $exe
          if (!$restarted) { throw 'The update did not restart TikTok-Bot.' }
          foreach ($process in $restarted) {
            if (!$process.CloseMainWindow() -or !$process.WaitForExit(10000)) {
              if (!$process.HasExited) { $process.Kill(); $process.WaitForExit() }
            }
          }
          if (!(Test-Path -LiteralPath $shortcut)) { throw 'Desktop shortcut is missing.' }
          $shell = New-Object -ComObject WScript.Shell
          if ($shell.CreateShortcut($shortcut).TargetPath -ine $exe) { throw 'Desktop shortcut target is incorrect.' }
          Invoke-CheckedProcess $exe '--smoke-test'
          $oldOutputEncoding = $OutputEncoding
          $OutputEncoding = [Text.UTF8Encoding]::new($false)
          try {
            $installedPiper = Join-Path $installed 'piper'
            foreach ($speaker in @(-1, 4, 0, 6, 7, 5)) {
              $voice = if ($speaker -lt 0) { 'de_DE-kerstin-low' } else { 'de_DE-thorsten_emotional-medium' }
              $wav = Join-Path $env:RUNNER_TEMP "piper-$speaker.wav"
              'Hallo, schön dass du beim Livestream dabei bist.' | & "$installedPiper/piper.exe" --model "$installedPiper/$voice.onnx" --speaker ([Math]::Max(0,$speaker)) --output_file $wav
              if ($LASTEXITCODE -ne 0 -or (Get-Item -LiteralPath $wav).Length -lt 1024) { throw "Local voice failed: $voice / $speaker" }
            }
          } finally { $OutputEncoding = $oldOutputEncoding }
          Invoke-CheckedProcess (Join-Path $installed 'unins000.exe') '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          if (Test-Path -LiteralPath $shortcut) { throw 'Uninstall left the desktop shortcut.' }
          if (Test-Path (Join-Path $installed 'TikTok-Bot.exe')) { throw 'Uninstall left the application installed.' }
          "$( (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant() )  TikTok-Bot-Setup.exe" |
            Set-Content -Encoding ascii windows/build/TikTok-Bot-Setup.exe.sha256
          $digest = (Get-FileHash -LiteralPath $installer).Hash.ToLowerInvariant()
          @{version=$version; size=(Get-Item -LiteralPath $installer).Length; digest="sha256:$digest"} |
            ConvertTo-Json -Compress | Set-Content -Encoding ascii windows/build/windows-update.json
      - uses: actions/upload-artifact@v4
        with:
          name: TikTok-Bot-win-x64
          path: |
            windows/build/TikTok-Bot-Setup.exe
            windows/build/TikTok-Bot-Setup.exe.sha256
            windows/build/windows-update.json
          if-no-files-found: error
