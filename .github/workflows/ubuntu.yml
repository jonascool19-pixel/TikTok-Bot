name: Ubuntu build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: bash -n install.sh
      - name: Install and verify the Ubuntu service
        shell: bash
        run: |
          set -o pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # The hosted image ships Firefox as a deb, whose upgrade migrates it to Snap.
            # The Snap Store is unavailable on this runner. Fresh Ubuntu CTs have no Firefox.
            if dpkg-query -W firefox >/dev/null 2>&1; then sudo apt-mark hold firefox; fi
            installer=$(mktemp)
            curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/install.sh" -o "$installer"
            (umask 077; sudo bash "$installer" > "$RUNNER_TEMP/tiktok-install.out")
            rm -f "$installer"
          else
            (umask 077; sudo bash install.sh --skip-os-upgrade > "$RUNNER_TEMP/tiktok-install.out")
          fi
          port=$(sed -nE 's/^Environment=BOT_PORT=([0-9]+)$/\1/p' /etc/systemd/system/tiktok-bot.service)
          test "$port" -ge 1024
          curl --fail --silent "http://127.0.0.1:$port/health"
          export TEST_BOT_PORT="$port"
          systemctl is-enabled --quiet tiktok-bot
          python3 - <<'PY'
          import os, re, subprocess
          output = open(os.environ['RUNNER_TEMP'] + '/tiktok-install.out').read()
          password = re.search(r'Passwort: ([A-Za-z0-9_-]{24})', output)[1]
          print('::add-mask::' + password)
          subprocess.run(['node', 'scripts/ubuntu-smoke.js', 'http://127.0.0.1:' + os.environ['TEST_BOT_PORT']],
                         env={**os.environ, 'BOT_TEST_PASSWORD': password}, check=True)
          PY
          (umask 077; sudo bash install.sh --skip-os-upgrade > "$RUNNER_TEMP/tiktok-reinstall.out")
          grep -q 'Bestehendes Passwort verwenden' "$RUNNER_TEMP/tiktok-reinstall.out"
          grep -Fxq "Environment=BOT_PORT=$port" /etc/systemd/system/tiktok-bot.service
          sudo rm -f "$RUNNER_TEMP/tiktok-install.out"
      - name: Show installer diagnostics on failure
        if: failure()
        run: |
          sudo tail -n 100 /var/log/tiktok-bot-install.log || true
          sudo journalctl -u tiktok-bot -n 50 --no-pager || true
      - name: Package Ubuntu installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist/tiktok-bot
          cp -r install.sh package.json package-lock.json src web README.md dist/tiktok-bot/
          tar -czf dist/tiktok-bot-ubuntu-24.04-x64.tar.gz -C dist tiktok-bot
          cd dist
          sha256sum tiktok-bot-ubuntu-24.04-x64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: tiktok-bot-ubuntu-24.04-x64
          path: |
            dist/tiktok-bot-ubuntu-24.04-x64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
