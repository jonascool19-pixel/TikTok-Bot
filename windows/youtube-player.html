<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><title>YouTube-Player</title>
<style>html,body,#player{width:100%;height:100%;margin:0;background:#111521;color:#fff}iframe{display:block;border:0}</style></head>
<body><div id="player">YouTube-Player lädt …</div>
<script>
const id = new URLSearchParams(location.search).get('v');
window.playerState = 'waiting';
window.onYouTubeIframeAPIReady = () => {
    if (!/^[A-Za-z0-9_-]{11}$/.test(id)) { window.playerState = 'error'; return; }
    window.youtubePlayer = new YT.Player('player', {
        width: '100%', height: '100%', videoId: id,
        playerVars: { autoplay: 1, origin: location.origin, playsinline: 1 },
        events: {
            onReady: () => { window.playerState = 'ready'; },
            onAutoplayBlocked: () => { window.playerState = 'paused'; },
            onError: () => { window.playerState = 'error'; },
            onStateChange: e => {
                const states = {0:'ended',1:'playing',2:'paused',3:'waiting',5:'ready'};
                window.playerState = states[e.data] || 'waiting';
            }
        }
    });
};
</script><script src="https://www.youtube.com/iframe_api"></script>
</body></html>
